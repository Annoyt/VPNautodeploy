name: vpn-bot

services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3x-ui
    restart: unless-stopped
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
    volumes:
      - 3xui-data:/etc/x-ui
      - ./3x-ui/cert:/root/cert
      # Cloudflare-fronted VLESS+WS+TLS origin cert (Phase H).
      # acme.sh maintains the cert files on the host and restarts
      # this container after renewals so Xray re-reads them.
      - /etc/ssl/cdn:/etc/ssl/cdn:ro
    ports:
      - "443:443"
      - "2026:2026"
      - "8443:8443"
      # Cloudflare-fronted VLESS+WS+TLS — CF free plan supports 2053
      # as origin port for orange-cloud proxying. Client connects to
      # https://cdn.nekoweather.xyz:2053/..., CF terminates TLS at
      # edge, re-encrypts, and forwards to origin:2053.
      - "2053:2053"
      # Shadowsocks-2022 backend behind ShadowTLS on entry. Entry's
      # shadow-tls forwards verified shadow traffic from :443 to
      # exit:8444 here. Not reachable from public clients directly —
      # they always hit the entry's ShadowTLS frontend.
      - "8444:8444"
      - "8444:8444/udp"
      # VMess+xhttp transport (Phase G1) — second CDN-fronted variant
      # alongside httpupgrade on :2053. CF Origin Rule routes the
      # /api/v2/observations path here so both protocols share the
      # cdn.nekoweather.xyz hostname and differ only by URL path.
      - "2054:2054"
    networks:
      - vpn-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2026/this_is_fine/"]
      interval: 30s
      timeout: 10s
      retries: 3

  vpn-bot:
    build: .
    container_name: vpn-bot
    restart: unless-stopped
    # Lets the bot reach the kimi-bridge HTTP service running on the host
    # (kimi CLI binary + OAuth creds live in /root/.kimi-code, not inside
    # this container). With this mapping, http://host.docker.internal:7077
    # resolves to the docker bridge gateway from inside the container.
    # `host.docker.internal` gateway lets the bot reach host-side
    # sidecars (kimi-bridge on :7077, xray-reload on :7079); they bind
    # 127.0.0.1 on the host, so this mapping is the only way through.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID}
      - MODE=${MODE}
      - FORUM_GROUP_ID=${FORUM_GROUP_ID}
      - ENTRY_NODE_IP=${ENTRY_NODE_IP}
      - REALITY_PUBLIC_KEY=${REALITY_PUBLIC_KEY}
      # Reality short ID and SNI - must match what x-ui inbound has configured,
      # otherwise the client TLS handshake works (masquerade page from SNI host
      # returns OK so v2rayTun shows "Connected") but Reality auth fails and
      # no tunnel is actually built. Bot uses defaults '01'/'www.microsoft.com'
      # if these are missing — that's wrong, prod inbound has a 16-char sid.
      - SID_VALUE=${SID_VALUE}
      - SNI_VALUE=${SNI_VALUE:-www.microsoft.com}
      - DEMO_TRAFFIC_GB=${DEMO_TRAFFIC_GB:-5}
      - DEMO_DAYS=${DEMO_DAYS:-7}
      # Admin dashboard URL (Caddy + Let's Encrypt on the host serves
      # https://<domain>:9443 → http://localhost:8080)
      - WEBAPP_URL=${WEBAPP_URL}
      # Kimi-code AI bridge — host service that wraps the kimi CLI
      - KIMI_BRIDGE_URL=${KIMI_BRIDGE_URL:-}
      - KIMI_BRIDGE_TOKEN=${KIMI_BRIDGE_TOKEN:-}
      - TOPIC_AI=${TOPIC_AI:-}
      # Host-side Xray reload sidecar — see scripts/xray_reload.py.
      # Empty URL → reload becomes a no-op (debug/dev mode).
      - XRAY_RELOAD_URL=${XRAY_RELOAD_URL:-http://host.docker.internal:7079}
      - XRAY_RELOAD_TOKEN=${XRAY_RELOAD_TOKEN:-}
      - XUI_API_URL=http://3x-ui:2026
      - XUI_BASE_PATH=/this_is_fine
      - XUI_API_PATH=/this_is_fine/panel/api/inbounds
      - DB_PATH=/var/lib/vpn-bot/bot.db
      # XUI_DB_PATH must point to the actual Docker volume used by 3x-ui container
      - XUI_DB_PATH=/var/lib/docker/volumes/vpn-bot_3xui-data/_data/x-ui.db
      - XUI_USERNAME=${XUI_USERNAME:-not_me}
      - XUI_PASSWORD=${XUI_PASSWORD:-admin}
      # Hysteria2 sidecar — empty HY2_HOST disables Hy2 link emission.
      - HY2_HOST=${HY2_HOST:-}
      - HY2_PORT=${HY2_PORT:-8400}
      - HY2_SNI=${HY2_SNI:-}
      # Cloudflare-fronted VLESS+WS+TLS (Phase H) — empty WS_HOST
      # disables WS link emission and dual-write to WS inbound.
      - WS_HOST=${WS_HOST:-}
      - WS_PORT=${WS_PORT:-2053}
      - WS_SNI=${WS_SNI:-}
      - WS_PATH=${WS_PATH:-/api/v1/forecast}
      - WS_INBOUND_ID=${WS_INBOUND_ID:-0}
      # G1: second VMess transport (xhttp) sharing the same host but
      # routed by URL path to exit:2054 via CF Origin Rule.
      - WS2_HOST=${WS2_HOST:-}
      - WS2_PORT=${WS2_PORT:-443}
      - WS2_SNI=${WS2_SNI:-}
      - WS2_PATH=${WS2_PATH:-/api/v2/observations}
      # Reality entry-side port. Used to be 443; we moved HAProxy to
      # 8443 to free :443 for the ShadowTLS frontend. Old Reality
      # keys with :443 in the URL now hit ShadowTLS instead and break.
      - ENTRY_NODE_PORT=${ENTRY_NODE_PORT:-443}
      # ShadowTLS v3 + Shadowsocks-2022 (cascade step #4) — disables
      # when STLS_HOST is empty. Server pre-shares the magic password
      # via STLS_PASSWORD; per-user SS keys are derived from UUID +
      # SS_USER_SALT so the bot can regenerate them on the fly.
      - STLS_HOST=${STLS_HOST:-}
      - STLS_PORT=${STLS_PORT:-443}
      - STLS_SNI=${STLS_SNI:-www.microsoft.com}
      - STLS_VERSION=${STLS_VERSION:-3}
      - STLS_PASSWORD=${STLS_PASSWORD:-}
      - SS_METHOD=${SS_METHOD:-2022-blake3-aes-128-gcm}
      - SS_SERVER_PASSWORD=${SS_SERVER_PASSWORD:-}
      - SS_USER_SALT=${SS_USER_SALT:-}
      - SS_INBOUND_ID=${SS_INBOUND_ID:-0}
    volumes:
      - vpn-bot-data:/var/lib/vpn-bot
      - vpn-bot-logs:/var/log/vpn-bot
      # Direct X-UI DB access (required for add_client_sync / remove_client_sync).
      # Must be writable: startup sync and remove_client both write to x-ui.db.
      - 3xui-data:/var/lib/docker/volumes/vpn-bot_3xui-data/_data
      # Shared scratch dir for Telegram → Kimi photo ingestion. AIHandler
      # writes screenshots here from inside the container; the kimi
      # binary on the host reads them off the same path. Cleaned by the
      # hourly scheduler in NotificationService.
      - /tmp/tg_media:/tmp/tg_media
    depends_on:
      3x-ui:
        condition: service_healthy
    networks:
      - vpn-net
    # Note: Web server port is exposed for health checks
    # In production, use reverse proxy (nginx) for external access
    ports:
      - "127.0.0.1:8080:8080"  # Bind to localhost only for security

volumes:
  3xui-data:
    driver: local
  vpn-bot-data:
    driver: local
  vpn-bot-logs:
    driver: local

networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
