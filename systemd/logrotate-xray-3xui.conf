# Installed as /etc/logrotate.d/xray-3xui on the EXIT host.
# Xray keeps the file descriptor open, hence copytruncate; the DPI
# reporter detects the shrink and restarts its offsets from zero.
/var/lib/docker/volumes/vpn-bot_3xui-data/_data/access.log
/var/lib/docker/volumes/vpn-bot_3xui-data/_data/error.log {
    size 50M
    rotate 3
    compress
    missingok
    notifempty
    copytruncate
}
