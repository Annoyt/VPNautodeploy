# Drop-in for hysteria.service AND hysteria-turbo.service on EXIT (AGENTS.md §53,
# docs/runbooks/entry_hop_tls.md):
#   install -D -m 0644 hysteria-entry-hop.conf /etc/systemd/system/hysteria.service.d/entry-hop.conf
#   install -D -m 0644 hysteria-entry-hop.conf /etc/systemd/system/hysteria-turbo.service.d/entry-hop.conf
#
# The auth callback goes to https://entry-hop.invalid:8448/api/hy2/auth (turbo:
# /api/hy2t/auth), the bot's HTTPS listener on entry; the password it carries
# is the user's uuid. Hysteria has no CA option for that call, so:
#  - SSL_CERT_DIR adds /etc/nekovpn-hop, the hop's pinned certificate, to the
#    system's CAs, for this unit only. The system's CAs stay: hysteria may
#    need them (ACME, a proxy masquerade, DoH). None of them can certify a
#    .invalid name, so only the pin passes for entry-hop.invalid, and the
#    pin's name constraints let it vouch for nothing else.
#  - BindReadOnlyPaths gives the unit /etc/nekovpn-hop/hosts as its /etc/hosts:
#    entry-hop.invalid resolves to entry's address whatever rewrites the real
#    /etc/hosts (cloud-init at boot). No such file = the unit does not start.
[Service]
Environment=SSL_CERT_DIR=/etc/ssl/certs:/etc/nekovpn-hop
BindReadOnlyPaths=/etc/nekovpn-hop/hosts:/etc/hosts
