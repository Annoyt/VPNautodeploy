[pytest]
asyncio_default_fixture_loop_scope = function
testpaths = tests
norecursedirs = e2e
filterwarnings =
    ignore::pytest.PytestDeprecationWarning
# CI deselects both: -m "not requires_docker and not requires_network".
# A test that needs either carries the marker, so CI drops it explicitly
# instead of trusting it to skip itself on a bare runner.
markers =
    requires_docker: needs a live docker stack (3x-ui container, bot volume mounts)
    requires_network: needs outbound internet access (real hosts, not loopback)
