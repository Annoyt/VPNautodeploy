# Test levels 1-3 of the pyramid (AGENTS.md "Test strategy") on every PR
# into main and every push to main. Level 4 (deploy sha-smoke) stays in
# scripts/deploy_to_entry.sh — it needs the prod host.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR/branch cancels the run it made stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  tests:
    # Unit + real-sqlite integration. e2e/ is excluded by pytest.ini
    # norecursedirs; tests that need a live docker stack or the internet
    # carry requires_docker / requires_network and are deselected here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'   # the prod image is python:3.11-slim
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest tests/
        run: >-
          python -m pytest tests/ -q -p no:cacheprovider
          -m "not requires_docker and not requires_network"

  e2e:
    # Playwright browser smoke of the admin dashboard. A SEPARATE job, not
    # just a separate step: playwright's sync API leaves an event loop on
    # the main thread that breaks pytest-asyncio tests run after it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Without it a runner that lost chromium would go green on 7 skips.
      E2E_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # Each playwright release pins its own browser build, so the cache
      # is keyed by the installed playwright version.
      - name: Resolve playwright version
        id: playwright
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # --with-deps apt-installs chromium's system libraries (not cached);
      # the browser download itself is skipped on a cache hit.
      # --only-shell: the suite runs headless, which needs only
      # chromium-headless-shell (~260 MB on disk vs ~660 MB with the full
      # browser). A future headed test would fail (E2E_REQUIRE_BROWSER),
      # not skip — then drop the flag.
      - name: Install Chromium
        run: python -m playwright install --with-deps --only-shell chromium

      - name: pytest tests/e2e
        run: python -m pytest tests/e2e -q -p no:cacheprovider
